allowBuilds:
  core-js: false
  esbuild: false
  unrs-resolver: false

autoDedupe: true

autoInstallPeers: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAge: 720

minimumReleaseAgeExclude:
  - "@codemod-utils/*"
  - "@ijlee2-frontend-configs/*"

overrides:
  "testem": "^4.0.0-beta.3" # Due to ember-cli

packages:
  - "configs/**"
  - "packages/ember-testem"
  - "packages/install-ember-testem"
  - "tests/**"

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*stylelint*"

resolvePeersFromWorkspaceRoot: false

verifyDepsBeforeRun: "warn"
