          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test app
        run: pnpm build:test
        working-directory: 'tests/my-v1-app'

      - name: Upload test app
        uses: actions/upload-artifact@v7
        with:
          name: 'my-v1-app-dist'
          path: 'tests/my-v1-app/dist'


  test-my-v1-app:
    name: Test (my-v1-app)
    needs: [build-test-app-my-v1-app]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
