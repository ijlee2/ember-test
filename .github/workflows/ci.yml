name: CI

on: 
  push:
    branches:
      - main
  pull_request:

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out a copy of the repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint


  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package-location:
          - 'packages/ember-testem'
          - 'packages/install-ember-testem'
    timeout-minutes: 5
    steps:
      - name: Check out a copy of the repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test
        working-directory: ${{ matrix.package-location }}


  build-test-app-my-v1-addon:
    name: Build test app (my-v1-addon)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out a copy of the repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test app
        run: pnpm build:test
        working-directory: 'tests/my-v1-addon'

      - name: Upload test app
        uses: actions/upload-artifact@v7
        with:
          name: 'my-v1-addon-dist'
          path: 'tests/my-v1-addon/dist'


  test-my-v1-addon:
    name: Test (my-v1-addon)
    needs: [build-test-app-my-v1-addon]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-scenario:
          - 'ember-cli'
          - 'ember-testem'
          - 'ember-testem:filter-by-filter'
          - 'ember-testem:filter-by-module'
    timeout-minutes: 5
    steps:
      - name: Check out a copy of the repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download test app
        uses: actions/download-artifact@v8
        with:
          name: 'my-v1-addon-dist'
          path: 'tests/my-v1-addon/dist'

      - name: Test
        run: pnpm test:${{ matrix.test-scenario }}
        working-directory: 'tests/my-v1-addon'


  build-test-app-my-v1-app:
    name: Build test app (my-v1-app)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out a copy of the repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ env.NODE_VERSION }}
